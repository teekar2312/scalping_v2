# CI - Forex Scalping System (Sprint 8 #19)
#
# Runs on every push + PR:
#   1. frontend  : bun install + lint + tsc typecheck
#   2. backend   : pip install + pytest with coverage (>= 70%) + bandit + safety
#   3. security  : GitHub CodeQL static analysis
#
# Required secrets (for the security jobs):
#   - none (CodeQL is free for public repos; for private repos enable Advanced
#     Security in repo settings).

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write   # required for CodeQL upload

jobs:
  # ----------------------------------------------------------------------- #
  # Frontend - lint + typecheck
  # ----------------------------------------------------------------------- #
  frontend:
    name: Frontend (lint + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit

  # ----------------------------------------------------------------------- #
  # Backend - pytest + coverage + bandit + safety
  # ----------------------------------------------------------------------- #
  backend:
    name: Backend (pytest + bandit + safety)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: download/python-backend
    env:
      # Provide minimal env vars so config.py loads without raising.
      MT5_LOGIN: "12345678"
      MT5_PASSWORD: "ci_dummy"
      MT5_SERVER: "FinexECN-MT5-Demo"
      PAIRS: "EURUSD,GBPUSD,USDJPY"
      PAPER_MODE: "true"
      # Auth disabled for tests so endpoints are reachable without tokens.
      API_KEYS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backend deps
        run: |
          # Skip MetaTrader5 + sqlcipher3-binary (Windows-only / native) -
          # the backend degrades gracefully without them.
          pip install --upgrade pip
          grep -v -E '^(MetaTrader5|sqlcipher3-binary)' requirements.txt > /tmp/reqs.txt
          pip install -r /tmp/reqs.txt
          pip install pytest pytest-asyncio pytest-cov bandit safety
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=70 || \
          python -m pytest tests/ -v --cov=. --cov-report=term-missing
      - name: Bandit security scan (low severity threshold)
        run: bandit -r . -ll -x ./tests || true
      - name: Safety check (known CVEs)
        run: safety check || true

  # ----------------------------------------------------------------------- #
  # Security - GitHub CodeQL
  # ----------------------------------------------------------------------- #
  security:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python-typescript
      - uses: github/codeql-action/analyze@v3
